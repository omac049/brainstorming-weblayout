            - heading "Build Your Future in Business" [level=2] [ref=e364]
            - generic [ref=e365]:
              - generic [ref=e366]:
                - generic [ref=e367] [cursor=pointer]: Career Opportunities
                - generic [ref=e369] [cursor=pointer]: Courses in Business
                - generic [ref=e371] [cursor=pointer]: Faculty & Support
              - generic [ref=e373]:
                - paragraph [ref=e378]: There are a large number of career opportunities in the field of business. Aside from those related to e-commerce and digital marketing, the traditional roles in economics, business administration, and project management are still integral to economic success. An online business degree can not only prove your abilities in these familiar positions but also showcase your dedication to the field to future employers.
                - generic [ref=e379]:
                  - paragraph [ref=e381]: UAGC offers a variety of online business degrees with courses that equip you with the resources to succeed in today’s economic environment. There will be plenty of options to fulfill your elective credit hours within or beyond your specialized scope. Explore other interesting business paths while working your way toward your degree, as well as the various online business degree courses available through UAGC. Find the one that is best for you.
                  - link "View Business Courses" [ref=e382] [cursor=pointer]:
                    - /url: https://www.uagc.edu/catalog/course-description/bus-business
                - paragraph [ref=e385]: Our faculty members are responsible for equipping you with the appropriate business knowledge, critical thinking, and skills needed to be successful in both your personal and professional business career. Our business programs are taught by faculty members who have the professional experience needed to get you started in a career in business. Additionally, pursuing an online degree can connect you with a wide range of students and faculty. Don’t be afraid to ask your professors and fellow students questions, as those questions may point you to your next job lead or career.
          - generic [ref=e387]:
            - generic [ref=e389]:
              - heading "Why Choose UAGC for Your Business Degree?" [level=2] [ref=e390]
              - paragraph [ref=e392]: Explore how we stand out from the competition by providing an experience that is unique from traditional universities. Our convenient and flexible online format and accelerated 5- to 6-week courses make earning a college degree accessible to busy adult learners.
