          - paragraph [ref=e734]: "The University of Arizona Global Campus does not discriminate in its education programs and activities on the basis of race, color, creed, national or ethnic origin, religion, sex, pregnancy, childbirth and related medical conditions, marital status, medical condition, genetic information, service in the uniformed services, political activities and affiliations, age, disability, sexual orientation, gender identity, veteran status, or any other consideration made unlawful by federal, state, or local laws. Specifically, Title IX/SaVE requires the University not to discriminate on the basis of gender/sex in its education programs and activities. Gender/sex harassment, including gender/sex violence, is a form of prohibited gender/sex discrimination. Examples of covered acts are found in the University's Title IX Nondiscrimination Policy. Questions regarding Title IX may be referred to the UAGC Title IX Coordinator, Leah Belsley, at titleix@uagc.edu, or 180 South Arizona Avenue, Suite #301 Chandler, AZ 85225, 800.798.0584 Ext. 20705 or to the Office for Civil Rights at Office for Civil Rights (OCR), United States Department of Education, Washington DC 20201, and/or a criminal complaint with local law enforcement."
