name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "prototypes/**"
      - "decks/**"
      - "output/playwright/screenshots/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: prototypes/package-lock.json

      - run: npm ci
        working-directory: prototypes

      - run: npm run build
        working-directory: prototypes
        env:
          GITHUB_PAGES: "true"

      - name: Copy decks and audit pages into build output
        run: |
          cp -r decks prototypes/out/decks
          mkdir -p prototypes/out/output/playwright
          cp -r output/playwright/screenshots prototypes/out/output/playwright/screenshots

      - name: Create deck screenshot aliases
        run: |
          mkdir -p prototypes/out/decks/screenshots
          SS=output/playwright/screenshots
          cp "$SS/homepage_desktop-1440.png"                       prototypes/out/decks/screenshots/homepage-desktop.png
          cp "$SS/organic-07-blog-phd-doctorate_desktop-1440.png"  prototypes/out/decks/screenshots/blog-phd-desktop.png
          cp "$SS/online-degrees_desktop-1440.png"                 prototypes/out/decks/screenshots/online-degrees-desktop.png
          cp "$SS/request-info-v5_desktop-1440.png"                prototypes/out/decks/screenshots/rfi-v5-desktop.png
          cp "$SS/degree-programs-v7_desktop-1440.png"             prototypes/out/decks/screenshots/degree-programs-v7-desktop.png

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prototypes/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
